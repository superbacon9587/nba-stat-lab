[project]
name = "nbalab"
version = "0.1.0"
description = "NBA Stat Lab: plain-English NBA stat splits, significance tests, and projections."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "plotly>=5.22",
    "streamlit>=1.36",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "nba-api>=1.11.4",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
